services:
  - type: web
    name: eventora
    runtime: node
    plan: free
    buildCommand: npm install && npm run install:all && npm run build
    startCommand: NODE_ENV=production npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false